name: build-cropdoctor-api
on:
  workflow_dispatch:
  push:
    paths:
      - 'cropdoctor_api/**'
      - '.github/workflows/build-api.yml'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./cropdoctor_api
          push: true
          tags: ghcr.io/omarwalied177/cropdoctor-api:latest
