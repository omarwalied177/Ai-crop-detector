name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r azure/requirements.txt
          pip install pytest httpx

      - name: Compile and Lint Check
        run: |
          python -m py_compile azure/main.py

      - name: Test FastAPI Health and Dummy Mode
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from azure.main import app
          client = TestClient(app)
          resp = client.get('/api/health')
          assert resp.status_code == 200, f'Health check failed: {resp.text}'
          data = resp.json()
          assert data.get('status') == 'ok', f'Unexpected status: {data}'
          print('Health probe succeeded:', data)
          "
